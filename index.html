<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#1faa4b">
<script>/* low-RAM / slow-CPU detection runs before first paint */
(function(){var m=navigator.deviceMemory,c=navigator.hardwareConcurrency,s=navigator.connection&&navigator.connection.saveData;
window.LITE=!!(s||(m&&m<=4)||(c&&c<=4)||matchMedia('(prefers-reduced-motion:reduce)').matches);
if(LITE)document.documentElement.className='lite'})();</script>
<title>Freshly - Groceries in minutes</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/glass.css">
<body>
<div id="app">
  <div id="view"></div>
  <div id="cartbar"></div>
  <nav id="nav"></nav>
  <div id="overlay"></div>
  <div id="toast"></div>
</div>
<script defer src="js/data.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/location.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
